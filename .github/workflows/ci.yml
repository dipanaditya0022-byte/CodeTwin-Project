name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # The Azure SQL path: T-SQL schema and migrations, then the whole API suite on SQL Server 2022.
  sqlserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema, migrations and T-SQL behaviour
        run: db/tests/run_sqlserver.sh
      - name: API tests on SQL Server
        run: db/tests/run_api_on_sqlserver.sh
